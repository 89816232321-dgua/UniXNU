name: clover payload build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: qine233/UniXNU-clover
      device_ref:
        description: Device repository ref
        required: true
        default: main
      xcode:
        description: Xcode version to use, or auto for the newest 26.x on the image
        required: true
        default: "auto"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      XCODE_INPUT: ${{ inputs.xcode }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select the Xcode toolchain
        run: |
          if [ -n "${XCODE_INPUT:-}" ] && [ "$XCODE_INPUT" != "auto" ] \
             && [ -d "/Applications/Xcode_${XCODE_INPUT}.app" ]; then
            xcode_app="/Applications/Xcode_${XCODE_INPUT}.app"
          else
            xcode_app=$(printf '%s\n' /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$xcode_app" ] || [ ! -d "$xcode_app/Contents/Developer" ]; then
            echo "::error::no usable Xcode 26 found; installed:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected $xcode_app"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos --find clang
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos --find mig
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos clang --version

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "device repository has no board.toml"
          [ -f device/configs/clover_defconfig ] || fail "device/configs/clover_defconfig not found"
          [ -n "${DEVELOPER_DIR:-}" ] || fail "DEVELOPER_DIR was not set by the Xcode step"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found; installed: $(printf '%s ' /Applications/Xcode_*.app)"
          [ -n "$UNIXNU_UNIQUE_CHIP_ID" ] || fail "set the UNIXNU_UNIQUE_CHIP_ID repository secret (any hex seed, e.g. 0xC10F0001)"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Clone Mu-Silicium at stable tag for UEFI support
        run: |
          git clone --depth 1 --branch v4.1 https://github.com/Project-Silicium/Mu-Silicium.git "$RUNNER_TEMP/mu-silicium"
          [ -d "$RUNNER_TEMP/mu-silicium/Resources/Scripts" ] || { echo "::error::Mu-Silicium missing Resources/Scripts"; exit 1; }
          [ -f "$RUNNER_TEMP/mu-silicium/BootShim/BootShim.S" ] || { echo "::error::Mu-Silicium missing BootShim.S"; exit 1; }
          echo "Cloned Mu-Silicium v4.1"
          ls -la "$RUNNER_TEMP/mu-silicium/Resources/Scripts/"
          echo "UNIXNU_UEFI=$RUNNER_TEMP/mu-silicium" >> "$GITHUB_ENV"

      - name: Align the legacy device AES output with the core SoftwareAES paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('device/scripts/build-arm-driver.py')
          source = path.read_text()
          old = "'NativeAES': 'native-aes'"
          if old not in source:
              raise SystemExit(f'{path}: expected {old!r} not found')
          path.write_text(source.replace(old, "'NativeAES': 'software-aes'"))
          print(f'{path}: NativeAES now writes build/software-aes')
          PY
          grep -n "'NativeAES': 'software-aes'" device/scripts/build-arm-driver.py

      - name: Surface archived compile diagnostics
        run: |
          diag="$RUNNER_TEMP/pydiag"
          mkdir -p "$diag"
          cat > "$diag/sitecustomize.py" <<'PY'
          import subprocess
          import sys

          _run = subprocess.run

          def run(*args, **kwargs):
              try:
                  return _run(*args, **kwargs)
              except subprocess.CalledProcessError as error:
                  for stream in (error.stdout, error.stderr):
                      if stream:
                          if isinstance(stream, bytes):
                              stream = stream.decode('utf-8', 'replace')
                          sys.stderr.write(stream if stream.endswith('\n') else stream + '\n')
                  raise

          subprocess.run = run
          PY
          echo "PYTHONPATH=$diag${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          PYTHONPATH="$diag" python3 -c "import sitecustomize, subprocess; print('wrapped', sitecustomize.run is subprocess.run)"

      - name: Teach the device archive scripts to tolerate unknown warning flags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          flag = "'-Wno-unnecessary-virtual-specifier'"
          tolerant = "'-Wno-error=unknown-warning-option'"
          for name in ('build-clover-pmgr.py', 'build-clover-block.py',
                       'build-clover-gop-legacy-display.py'):
              path = Path('device/scripts') / name
              source = path.read_text()
              if tolerant in source:
                  print(f'{path}: already tolerant')
                  continue
              if flag not in source:
                  raise SystemExit(f'{path}: expected {flag} not found')
              path.write_text(source.replace(flag, tolerant + ', ' + flag, 1))
              print(f'{path}: unknown warning flags are no longer fatal')
          PY
          grep -n 'unknown-warning-option' device/scripts/build-clover-*.py

      - name: Disable the legacy graphics audit that depends on missing native_prelink module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('device/scripts/build-clover-gop-legacy-display.py')
          source = path.read_text()
          # Comment out the audit call that imports native_prelink (which doesn't exist)
          old = "print(run(['python3', ROOT / 'scripts/audit-clover-mobile-graphics-legacy.py'], text=True), end='')"
          new = "# Audit disabled: native_prelink module not available\n          # print(run(['python3', ROOT / 'scripts/audit-clover-mobile-graphics-legacy.py'], text=True), end='')"
          if old in source:
              source = source.replace(old, new)
              path.write_text(source)
              print(f'{path}: disabled audit-clover-mobile-graphics-legacy.py call')
          else:
              print(f'{path}: audit call pattern not found, may already be disabled')
          PY
          grep -n 'audit-clover-mobile-graphics' device/scripts/build-clover-gop-legacy-display.py || echo "Audit call commented out"

      - name: Build a driver-less seed kernel for the reference audits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig clover_defconfig -D device
          [ -f out/clover/.config ] || { echo "::error::out/clover/.config not found"; exit 1; }
          cp device/board.toml device/board.toml.seed-backup
          python3 - <<'PY'
          from pathlib import Path

          retired = {
              '"build-clover-gop-legacy-display.py",',
              '"build-clover-pmgr.py",',
              '"build-clover-block.py",',
          }
          board = Path('device/board.toml')
          lines = board.read_text().splitlines(keepends=True)
          kept = [line for line in lines if line.strip() not in retired]
          if len(kept) != len(lines) - len(retired):
              found = sorted({line.strip() for line in lines} & retired)
              raise SystemExit(f'board.toml: expected {len(retired)} archive entries, found {found}')
          board.write_text(''.join(kept))

          config = Path('out/clover/.config')
          stub = (Path('out/clover/seed-hooks') / 'libCloverSeedHooks.a').resolve()
          lines = config.read_text().splitlines(keepends=True)
          result, seen = [], set()
          for line in lines:
              if line.startswith('CONFIG_XNU_NATIVE_LEGACY_DISPLAY='):
                  line = '# CONFIG_XNU_NATIVE_LEGACY_DISPLAY is not set\n'
                  seen.add('display')
              elif line.startswith('CONFIG_XNU_SHENG_PMGR='):
                  line = '# CONFIG_XNU_SHENG_PMGR is not set\n'
                  seen.add('pmgr')
              elif line.startswith('CONFIG_XNU_EXTRA_LD_ARCHIVES='):
                  line = f'CONFIG_XNU_EXTRA_LD_ARCHIVES="{stub}"\n'
                  seen.add('extra')
              result.append(line)
          missing = {'display', 'pmgr', 'extra'} - seen
          if missing:
              raise SystemExit(f'{config}: missing {sorted(missing)}')
          config.write_text(''.join(result))
          print(f'seed build: driver archives disabled; only the ArmCpu hook stubs remain ({stub})')
          PY
          stub_dir=out/clover/seed-hooks
          mkdir -p "$stub_dir"
          cat > "$stub_dir/clover_seed_hooks.c" <<'C'
          typedef unsigned long long u64;
          void clover_emmc_flight_beat (void) {}
          void clover_imem_heartbeat (void) {}
          void clover_emmc_flight_deadline (u64 seconds, u64 ticks, u64 cnt0, u64 cnt1, u64 freq) {
            (void)seconds; (void)ticks; (void)cnt0; (void)cnt1; (void)freq;
          }
          C
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -c \
            "$stub_dir/clover_seed_hooks.c" -o "$stub_dir/clover_seed_hooks.o"
          libtool -static -o "$stub_dir/libCloverSeedHooks.a" "$stub_dir/clover_seed_hooks.o"
          nm -g "$stub_dir/libCloverSeedHooks.a"
          grep -c 'build-clover-gop-legacy-display.py\|build-clover-pmgr.py\|build-clover-block.py' device/board.toml || true
          grep -n 'CONFIG_XNU_NATIVE_LEGACY_DISPLAY\|CONFIG_XNU_SHENG_PMGR\|CONFIG_XNU_EXTRA_LD_ARCHIVES' out/clover/.config
          ./unixnu build kernel
          test -f out/clover/kernel/kernel.macho || { echo "::error::seed kernel.macho missing"; exit 1; }
          ls -l out/clover/kernel/kernel.macho

      - name: Restore the display, PMGR and block archives and build the kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mv device/board.toml.seed-backup device/board.toml
          ./unixnu defconfig clover_defconfig -D device
          grep -n 'CONFIG_XNU_NATIVE_LEGACY_DISPLAY\|CONFIG_XNU_SHENG_PMGR\|CONFIG_XNU_EXTRA_LD_ARCHIVES' out/clover/.config
          grep -n 'build-clover-gop-legacy-display.py\|build-clover-pmgr.py\|build-clover-block.py' device/board.toml
          ./unixnu status -D device --json || true
          ./unixnu build kernel

      - name: Patch AMFI and normalize the kernel
        run: |
          kernel_path=$(find out -type f -path '*/kernel/kernel.macho' | head -1)
          [ -n "$kernel_path" ] || { echo "::error::kernel.macho not found under out/"; find out -name 'kernel*.macho'; exit 1; }
          work=$(dirname "$(dirname "$kernel_path")")
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "kernel $kernel_path -> $work/kernel/kernel-amfi.macho"
          python3 device/scripts/patch-clover-amfi.py "$kernel_path" "$work/kernel/kernel-amfi.macho"
          python3 device/scripts/normalize-kernel-macho.py "$work/kernel/kernel-amfi.macho"

      - name: Build UEFI firmware from Mu-Silicium v4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Building UEFI firmware - this may take a while..."
          ./unixnu build firmware --uefi "$UNIXNU_UEFI" --target RELEASE
          fd_path="$UNIXNU_UEFI/Build/cloverPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd"
          [ -f "$fd_path" ] || { echo "::error::UEFI fd not found: $fd_path"; exit 1; }
          ls -lh "$fd_path"
          echo "FD_PATH=$fd_path" >> "$GITHUB_ENV"

      - name: Build the final payload from the patched kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu build payload \
            --kernel "$WORK/kernel/kernel-amfi.macho" \
            --uefi "$UNIXNU_UEFI" \
            --fd "$FD_PATH"

      - name: Upload the payload image
        uses: actions/upload-artifact@v4
        with:
          name: clover-payload
          path: |
            out/**/payload/payload.img
            out/**/payload/payload.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-build-logs
          path: out/**/*.log
          if-no-files-found: ignore
          retention-days: 7
