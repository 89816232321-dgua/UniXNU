name: clover payload build

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: qine233/UniXNU-clover
      device_ref:
        description: Device repository ref
        required: true
        default: main
      xcode:
        description: Xcode version to use, or auto for the newest 26.x on the image
        required: true
        default: "auto"

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      XCODE_INPUT: ${{ inputs.xcode }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select the Xcode toolchain
        run: |
          if [ -n "${XCODE_INPUT:-}" ] && [ "$XCODE_INPUT" != "auto" ] \
             && [ -d "/Applications/Xcode_${XCODE_INPUT}.app" ]; then
            xcode_app="/Applications/Xcode_${XCODE_INPUT}.app"
          else
            xcode_app=$(printf '%s\n' /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$xcode_app" ] || [ ! -d "$xcode_app/Contents/Developer" ]; then
            echo "::error::no usable Xcode 26 found; installed:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected $xcode_app"
          "$xcode_app/Contents/Developer/usr/bin/xcodebuild" -version
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos --find clang
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos --find mig
          DEVELOPER_DIR="$xcode_app/Contents/Developer" xcrun --sdk iphoneos clang --version

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "device repository has no board.toml"
          [ -f device/configs/clover_defconfig ] || fail "device/configs/clover_defconfig not found"
          [ -n "${DEVELOPER_DIR:-}" ] || fail "DEVELOPER_DIR was not set by the Xcode step"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found; installed: $(printf '%s ' /Applications/Xcode_*.app)"
          [ -n "$UNIXNU_UNIQUE_CHIP_ID" ] || fail "set the UNIXNU_UNIQUE_CHIP_ID repository secret (any hex seed, e.g. 0xC10F0001)"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Provide the Mu-Silicium Font.h used by the entry probe
        run: |
          font_dir="$RUNNER_TEMP/uefi/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib"
          mkdir -p "$font_dir"
          url="https://raw.githubusercontent.com/Project-Silicium/Mu-Silicium/main/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h"
          curl -fsSL -o "$font_dir/Font.h" "$url" || \
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
               -H "Accept: application/vnd.github.raw" \
               -o "$font_dir/Font.h" \
               "https://api.github.com/repos/Project-Silicium/Mu-Silicium/contents/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h?ref=main"
          [ -s "$font_dir/Font.h" ] || { echo "::error::could not fetch Font.h"; exit 1; }
          echo "UNIXNU_UEFI=$RUNNER_TEMP/uefi" >> "$GITHUB_ENV"
          wc -c "$font_dir/Font.h"

      - name: Align the legacy device AES output with the core SoftwareAES paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('device/scripts/build-arm-driver.py')
          source = path.read_text()
          old = "'NativeAES': 'native-aes'"
          if old not in source:
              raise SystemExit(f'{path}: expected {old!r} not found')
          path.write_text(source.replace(old, "'NativeAES': 'software-aes'"))
          print(f'{path}: NativeAES now writes build/software-aes')
          PY
          grep -n "'NativeAES': 'software-aes'" device/scripts/build-arm-driver.py

      - name: Surface archived compile diagnostics
        run: |
          diag="$RUNNER_TEMP/pydiag"
          mkdir -p "$diag"
          cat > "$diag/sitecustomize.py" <<'PY'
          import subprocess
          import sys

          _run = subprocess.run

          def run(*args, **kwargs):
              try:
                  return _run(*args, **kwargs)
              except subprocess.CalledProcessError as error:
                  for stream in (error.stdout, error.stderr):
                      if stream:
                          if isinstance(stream, bytes):
                              stream = stream.decode('utf-8', 'replace')
                          sys.stderr.write(stream if stream.endswith('\n') else stream + '\n')
                  raise

          subprocess.run = run
          PY
          echo "PYTHONPATH=$diag${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          PYTHONPATH="$diag" python3 -c "import sitecustomize, subprocess; print('wrapped', sitecustomize.run is subprocess.run)"

      - name: Build a display-less seed kernel for the display archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig clover_defconfig -D device
          [ -f out/clover/.config ] || { echo "::error::out/clover/.config not found"; exit 1; }
          cp device/board.toml device/board.toml.seed-backup
          python3 - <<'PY'
          from pathlib import Path

          board = Path('device/board.toml')
          lines = board.read_text().splitlines(keepends=True)
          kept = [line for line in lines if line.strip() != '"build-clover-gop-legacy-display.py",']
          if len(kept) == len(lines):
              raise SystemExit('board.toml: display archive entry not found')
          board.write_text(''.join(kept))

          config = Path('out/clover/.config')
          text = config.read_text()
          flag = 'CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y'
          if flag not in text:
              raise SystemExit(f'{config}: {flag} not found')
          config.write_text(text.replace(flag, '# CONFIG_XNU_NATIVE_LEGACY_DISPLAY is not set'))
          print('seed build: display archive and CONFIG_XNU_NATIVE_LEGACY_DISPLAY disabled')
          PY
          grep -c 'build-clover-gop-legacy-display.py' device/board.toml || true
          grep -n 'CONFIG_XNU_NATIVE_LEGACY_DISPLAY' out/clover/.config
          ./unixnu build kernel
          test -f out/clover/kernel/kernel.macho || { echo "::error::seed kernel.macho missing"; exit 1; }
          ls -l out/clover/kernel/kernel.macho

      - name: Restore the display archive and build the kernel with it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mv device/board.toml.seed-backup device/board.toml
          ./unixnu defconfig clover_defconfig -D device
          grep -n 'CONFIG_XNU_NATIVE_LEGACY_DISPLAY' out/clover/.config
          grep -n 'build-clover-gop-legacy-display.py' device/board.toml
          ./unixnu status -D device --json || true
          ./unixnu build kernel

      - name: Patch AMFI and normalize the kernel
        run: |
          kernel_path=$(find out -type f -path '*/kernel/kernel.macho' | head -1)
          [ -n "$kernel_path" ] || { echo "::error::kernel.macho not found under out/"; find out -name 'kernel*.macho'; exit 1; }
          work=$(dirname "$(dirname "$kernel_path")")
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "kernel $kernel_path -> $work/kernel/kernel-amfi.macho"
          python3 device/scripts/patch-clover-amfi.py "$kernel_path" "$work/kernel/kernel-amfi.macho"
          python3 device/scripts/normalize-kernel-macho.py "$work/kernel/kernel-amfi.macho"

      - name: Build the final payload from the patched kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu build payload \
            --kernel "$WORK/kernel/kernel-amfi.macho" \
            --uefi "$UNIXNU_UEFI"

      - name: Upload the payload image
        uses: actions/upload-artifact@v4
        with:
          name: clover-payload
          path: |
            out/**/payload/payload.img
            out/**/payload/payload.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-build-logs
          path: out/**/*.log
          if-no-files-found: ignore
          retention-days: 7
